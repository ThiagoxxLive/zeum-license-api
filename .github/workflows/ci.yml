name: Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: registry.zeum.com.br/license-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./... -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: registry.zeum.com.br
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy via webhook
        run: |
          curl -sf -X POST "${{ secrets.CI_DEPLOY_URL }}" \
            -u "${{ secrets.CI_CLIENT_ID }}:${{ secrets.CI_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"service": "license-api-evyidx_api", "image": "${{ env.IMAGE }}:${{ github.sha }}"}'
